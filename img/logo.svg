<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">WeNeedFSD.eu</title>
  <desc id="logo-desc">European disc: twelve gold stars around a white steering wheel on navy.</desc>
  <defs>
    <!-- Regular 5-point star, circumradius 6.4, point up. -->
    <path id="logo-ceremonial-star" fill="#FFCC00" d="M0-6.4 1.4368-1.9776 6.087-1.9776 2.3251.7552 3.7619 5.1776 0 2.4448-3.7619 5.1776-2.3251.7552-6.087-1.9776-1.4368-1.9776Z"/>
  </defs>

  <circle cx="64" cy="64" r="64" fill="#003399"/>

  <!-- Star ring: centres on r=44, every 30°, first at 12 o'clock. Tip points radially out. -->
  <g id="stars">
    <use href="#logo-ceremonial-star" transform="translate(64 20) rotate(0)"/>
    <use href="#logo-ceremonial-star" transform="translate(86 25.894) rotate(30)"/>
    <use href="#logo-ceremonial-star" transform="translate(102.106 42) rotate(60)"/>
    <use href="#logo-ceremonial-star" transform="translate(108 64) rotate(90)"/>
    <use href="#logo-ceremonial-star" transform="translate(102.106 86) rotate(120)"/>
    <use href="#logo-ceremonial-star" transform="translate(86 102.106) rotate(150)"/>
    <use href="#logo-ceremonial-star" transform="translate(64 108) rotate(180)"/>
    <use href="#logo-ceremonial-star" transform="translate(42 102.106) rotate(210)"/>
    <use href="#logo-ceremonial-star" transform="translate(25.894 86) rotate(240)"/>
    <use href="#logo-ceremonial-star" transform="translate(20 64) rotate(270)"/>
    <use href="#logo-ceremonial-star" transform="translate(25.894 42) rotate(300)"/>
    <use href="#logo-ceremonial-star" transform="translate(42 25.894) rotate(330)"/>
  </g>

  <!-- Wheel: white disc, navy punch, three spokes (one at 6 o'clock), hub. -->
  <circle cx="64" cy="64" r="28" fill="#FFFFFF"/>
  <circle cx="64" cy="64" r="21" fill="#003399"/>
  <g stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round">
    <line x1="64" y1="70" x2="64" y2="85"/>
    <line x1="64" y1="70" x2="64" y2="85" transform="rotate(120 64 64)"/>
    <line x1="64" y1="70" x2="64" y2="85" transform="rotate(240 64 64)"/>
  </g>
  <circle cx="64" cy="64" r="6" fill="#FFFFFF"/>
</svg>
